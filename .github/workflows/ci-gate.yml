# CI Gate — thin wrapper over the dryvist org reusable workflow
#
# Delegates the standard checks to the org orchestrator
# `JacobPEvans/.github/.github/workflows/_ci-gate.yml@v1`; its `Merge Gate`
# summary job always reports, making it safe to require in rulesets.

name: CI Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Push runs save the Nix store cache that pull requests restore.
  push:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # Job id `gate` is the org-canonical caller shape: the required status
  # check context is `gate / Merge Gate` on every consumer.
  gate:
    permissions:
      contents: read
      pull-requests: read
      # The org gate's queue watchdog cancels stuck sibling jobs via the
      # Actions API; a called workflow can never exceed the caller's grant,
      # so `actions: write` must be granted here or the run fails at graph
      # validation (startup_failure).
      actions: write
    uses: JacobPEvans/.github/.github/workflows/_ci-gate.yml@v1
    with:
      profile: nix
      flake_lock_max_age_days: 30
      osv_scan: true
      nix_validate: true
      # Develop pushes check the runner's system only; pull requests already do.
      all_systems: false
      nix_validate_runner_label: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (vars.CI_RUNNER_LABEL || 'ubuntu-24.04') || 'ubuntu-latest' }}
      nix_validate_timeout_minutes: 45
      filters: |
        nix:
          - '**.nix'
          - 'flake.lock'
        markdown:
          - '**.md'
          - '.markdownlint*'

# CI Gate — thin wrapper over the dryvist org reusable workflow
#
# Delegates the standard checks to the org orchestrator and locally aggregates
# those results with the flake freshness check under the required gate context.

name: CI Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  # Push runs save the Nix store cache that pull requests restore.
  push:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  shared-gate:
    permissions:
      contents: read
      pull-requests: read
      # The org gate's queue watchdog cancels stuck sibling jobs via the
      # Actions API; a called workflow can never exceed the caller's grant,
      # so `actions: write` must be granted here or the run fails at graph
      # validation (startup_failure).
      actions: write
    uses: JacobPEvans/.github/.github/workflows/_ci-gate.yml@v1
    with:
      profile: nix
      osv_scan: true
      nix_validate: true
      # Develop pushes check the runner's system only; pull requests already do.
      all_systems: false
      # nix flake check builds in parallel; the s3-cache extra backs the cache step.
      # volume=80gb: the default root volume fills while the check closures build.
      nix_validate_runner_label: runs-on=${{ github.run_id }}/cpu=8/ram=32/family=m7+c7/extras=s3-cache/volume=80gb
      nix_validate_timeout_minutes: 45
      filters: |
        nix:
          - '**.nix'
          - 'flake.lock'
        markdown:
          - '**.md'
          - '.markdownlint*'

  flake-lock-fresh:
    name: Flake Lock Fresh
    permissions:
      contents: read
    uses: dryvist/.github/.github/workflows/_flake-lock-fresh.yml@cf39ed35622ae0c3398c0e8c8c1de7aa992f387b6
    with:
      max_age_days: 30

  # Preserve the required check context while aggregating both gates.
  gate:
    name: gate / Merge Gate
    needs: [shared-gate, flake-lock-fresh]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Aggregate results
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
